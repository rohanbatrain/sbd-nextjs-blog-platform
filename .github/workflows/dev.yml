name: Dev Pipeline (dev branch)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      docker_image: ${{ steps.set_image.outputs.img }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linting
        run: pnpm add -D eslint eslint-config-next

      

      # REMOVED: The workaround step was installing Next.js 16 CLI, which broke 'next lint'.
      
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Tests
        run: pnpm test -- --maxWorkers=50%

      - name: Build
        run: pnpm build

      # MOVED: Artifact must be uploaded here, immediately after build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone

  docker:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for Docker context)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ADDED: Required for multi-arch build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ADDED: Required for multi-arch build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ADDED: Force lowercase tags to prevent registry errors
      - name: Set tags
        id: set_image
        run: |
          # Convert to lowercase
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          
          GHCR_IMAGE="ghcr.io/${REPO_OWNER}/sbd-nextjs-${REPO_NAME}"
          DH_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/sbd-nextjs-${REPO_NAME}"
          
          echo "ghcr_tag=${GHCR_IMAGE}:dev" >> $GITHUB_OUTPUT
          echo "dh_tag=${DH_IMAGE}:dev" >> $GITHUB_OUTPUT

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.set_image.outputs.ghcr_tag }}
            ${{ steps.set_image.outputs.dh_tag }}
          build-args: |
            NODE_ENV=production
